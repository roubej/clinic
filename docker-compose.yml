x-cassandra-common: &cassandra-common
  image: cassandra:4.1
  environment: &cassandra-environment
    CASSANDRA_CLUSTER_NAME: ClinicCluster
    CASSANDRA_SEEDS: cassandra1,cassandra2
    CASSANDRA_DC: datacenter1
    CASSANDRA_RACK: rack1
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M
  healthcheck: &cassandra-healthcheck
    test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
    interval: 15s
    timeout: 30s
    retries: 20
    start_period: 10m

services:
  cassandra1:
    <<: *cassandra-common
    container_name: clinic-cassandra-1
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

  cassandra2:
    <<: *cassandra-common
    container_name: clinic-cassandra-2
    ports:
      - "127.0.0.1:9043:9042"
    volumes:
      - cassandra2_data:/var/lib/cassandra

  cassandra3:
    <<: *cassandra-common
    container_name: clinic-cassandra-3
    ports:
      - "127.0.0.1:9044:9042"
    volumes:
      - cassandra3_data:/var/lib/cassandra

  app:
    build: .
    container_name: clinic-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      CASSANDRA_HOSTS: cassandra1,cassandra2,cassandra3
      CASSANDRA_PORT: 9042
      CASSANDRA_LOCAL_DC: datacenter1
    command:
      - sh
      - -c
      - python -m db.init_schema && exec python -m streamlit run app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  cassandra_data:
  cassandra2_data:
  cassandra3_data:
